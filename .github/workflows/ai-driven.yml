name: "IA-Driven Development Workflow"

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: ia-driven-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ai_driven_task:
    name: "🧠 AI-Driven Task (#${{ github.event.issue.number }})"
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'ai-driven')

    steps:
      - name: "🔄 Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: 'develop'
          fetch-depth: 0

      - name: "📦 Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "📥 Install aider"
        run: pip install aider-chat --quiet

      - name: "🔧 Configure Git"
        run: |
          git config user.name "AI Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"

      - name: "🔑 Validate secrets"
        run: |
          if [ -z "$OPENAI_API_KEY" || -z "$MY_PAT" ]; then
            echo "::error::OPENAI_API_KEY ou MY_PAT não configurados"
            exit 1
          fi
          echo "✅ Secrets OK"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MY_PAT: ${{ secrets.MY_PAT }}